<html lang="pt-BR">
<head>

<title>Multifix | Pronta entrega em Teresina</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#F5B800;
    --bg:#121212;
    --panel:#1C1C1C;
    --panel2:#262626;
    --line:#333;
    --text:#F2F2F2;
    --muted:#A3A3A3;
    --red:#FF4D4D;
    --wa:#25D366;
    --font:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--bg)}
  body{font-family:var(--font);background:var(--bg);color:var(--text);padding-bottom:52px;min-height:100vh}
  header{background:#0B0B0B;padding:12px 16px;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line)}
  @media(max-width:420px){header{padding:10px 12px}}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto}
  .logo{height:44px;cursor:pointer;display:block;flex-shrink:1;min-width:0;width:auto;max-width:100%}
  .btn-top{background:var(--gold);color:#121212;text-decoration:none;font-weight:700;font-size:14px;padding:9px 12px;border-radius:8px;white-space:nowrap;flex-shrink:0}
  @media(max-width:420px){.logo{height:34px}.btn-top{font-size:12px;padding:8px 9px}}
  .trust{text-align:center;font-weight:600;font-size:14px;letter-spacing:.2px;color:var(--gold);padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .wrap{max-width:1100px;margin:0 auto;padding:14px}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:var(--font);font-size:15px;margin-bottom:12px;background:var(--panel);color:var(--text)}
  .search::placeholder{color:var(--muted)}
  .filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:20px;padding:7px 14px;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--gold);color:#121212;border-color:var(--gold);font-weight:700}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card .img{aspect-ratio:1/1;background:var(--panel2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
  .card .img img{width:100%;height:100%;object-fit:cover}
  .ph{color:var(--muted);font-size:13px;text-align:center;padding:10px}
  .card .info{padding:10px 12px 12px;display:flex;flex-direction:column;flex:1}
  .card .name{font-weight:600;font-size:15px;line-height:1.35;cursor:pointer;color:var(--text);margin-bottom:6px}
  .preco-linha{display:flex;align-items:center;gap:8px;min-height:20px;margin-top:6px}
  .old{color:var(--muted);text-decoration:line-through;font-size:13px;font-weight:500}
  .pct{color:var(--red);font-weight:800;font-size:14px}
  .price{font-size:20px;font-weight:800;color:var(--gold);margin:2px 0 10px}
  .btn{display:block;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:10px;border-radius:8px;background:var(--gold);color:#121212;margin-top:auto}
  .btn.ghost{background:transparent;border:2px solid var(--gold);color:var(--gold)}
  .btn.off{background:#2e2e2e;color:#777;pointer-events:none}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;margin-bottom:6px}
  .tag.ok{background:rgba(37,211,102,.15);color:#4ADE80}
  .tag.no{background:rgba(255,90,90,.15);color:#FF7A7A}
  .empty{padding:30px;text-align:center;color:var(--muted);grid-column:1/-1}

  /* detalhe */
  .detail{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:20px}
  @media(min-width:800px){.detail{grid-template-columns:1fr 1fr;padding:24px}}
  .main-wrap{position:relative}
  .gal img.main{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--panel2);border-radius:10px;border:1px solid var(--line);cursor:zoom-in;user-select:none}
  .gnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.55);color:#fff;border:0;width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer}
  .gnav.prev{left:8px} .gnav.next{right:8px}
  .thumbs{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:2px solid transparent;cursor:pointer}
  .thumbs img.on{border-color:var(--gold)}
  .back{display:inline-block;margin-bottom:12px;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline}
  h1{font-size:22px;font-weight:700;line-height:1.3;margin-bottom:8px}
  .det-price{font-size:30px;font-weight:800;color:var(--gold);margin:6px 0 10px}
  .desc{margin:14px 0;line-height:1.6;font-size:15px;color:#D6D6D6}
  .guar{background:var(--panel2);border-left:4px solid var(--gold);padding:10px 12px;border-radius:6px;font-size:14px;margin:14px 0;color:#E6E6E6}

  .acts .btn{padding:14px;font-size:16px}

  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:88vh;object-fit:contain;border-radius:8px;user-select:none}
  .lb-x{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.12);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:30px;line-height:1;cursor:pointer}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.12);color:#fff;border:0;width:48px;height:48px;border-radius:50%;font-size:30px;cursor:pointer}
  .lb-prev{left:12px} .lb-next{right:12px}
  .lb-leg{position:absolute;left:16px;right:16px;bottom:18px;text-align:center;color:#fff;font-size:15px;line-height:1.4;text-shadow:0 1px 4px #000;pointer-events:none}

  /* rodapé */
  footer{background:#0B0B0B;color:var(--muted);padding:26px 16px 22px;margin-top:30px;border-top:1px solid var(--line)}
  .pay{max-width:1100px;margin:0 auto;display:grid;gap:22px}

  .pay-item svg{width:32px;height:32px;flex-shrink:0;color:var(--text)}
  .loc{max-width:1100px;margin:22px auto 0;text-align:center;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}

<script>
const WA = "5586998164120";

// Link CSV da planilha publicada no Google Sheets.

const PLANILHA_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRlm6Hr-QgjylLgTjH7OktcQE00xF_btTxdhUckImu5N3AWezeALOGIyM9l_tV21w/pub?gid=1909977994&single=true&output=csv";

// ===== LISTA INTERNA (usada se a planilha não estiver conectada) =====
// status: "Disponível" | "Esgotado" | "Oculto"
let PRODUTOS = [
  {id:1,nome:"Kit de Ferramentas 46 peças",cat:"Ferramentas",preco:60,status:"Disponível",estoque:null,fotos:["fotos/kit46-1.jpg","fotos/kit46-2.jpg"],desc:"Kit com 46 peças: chave catraca reversível, soquetes, extensões, bits e chaves hexagonais. Para reparos automotivos e manutenção em casa ou na oficina."},

  {id:3,nome:"Compressor de Ar Portátil",cat:"Acessórios",preco:90,status:"Disponível",estoque:null,fotos:["fotos/compressor-1.jpg","fotos/compressor-2.jpg"],desc:"Compressor portátil para calibrar pneus de carro, moto, bicicleta e bolas. Calibragem rápida, sem depender de posto."},

  {id:5,nome:"Parafusadeira Deasoon",cat:"Ferramentas",preco:160,status:"Disponível",estoque:null,fotos:["fotos/parafusadeira-deasoon-1.jpg","fotos/parafusadeira-deasoon-2.jpg","fotos/parafusadeira-deasoon-3.jpg"],desc:"Parafusadeira e furadeira de impacto sem fio 20V, com 2 baterias, carregador, brocas, extensor e maleta de acessórios."},
  {id:6,nome:"Jogo de Soquetes 12 peças",cat:"Ferramentas",preco:70,status:"Disponível",estoque:null,fotos:["fotos/soquetes-1.jpg"],desc:"Jogo de soquetes e catraca reversível 1/2', com 12 peças em aço cromo-vanádio. Para parafusos e porcas automotivas e industriais."},
  {id:7,nome:"Maleta de Ferramentas 12 peças",cat:"Ferramentas",preco:60,status:"Disponível",estoque:null,fotos:["fotos/maleta-1.jpg","fotos/maleta-2.jpg","fotos/maleta-3.jpg"],desc:"Maleta com 12 ferramentas para uso doméstico: trena de 2 m, estilete, chave teste de tensão, fita isolante PVC, chaves de fenda e Phillips e alicate."},
  {id:8,nome:"Caixa de Som Bluetooth 50W",cat:"Eletrônicos",preco:150,status:"Disponível",estoque:null,fotos:["fotos/caixa-som-1.jpg","fotos/caixa-som-2.jpg"],desc:"Caixa de som multimídia Xtrad CS-29, sem fio, com LED RGB, bluetooth, TWS, entrada USB, cartão TF e rádio FM. Potência de 50W."},
  {id:9,nome:"Carregador Portátil 20000mAh",cat:"Eletrônicos",preco:75,status:"Oculto",estoque:null,fotos:[],desc:"Power bank de 20.000 mAh com visor digital e saídas Type-C, Micro USB e Lightning. Evita ficar sem bateria em viagens e no trabalho."},
  {id:10,nome:"Controle de PS4 e PC",cat:"Eletrônicos",preco:100,status:"Disponível",estoque:null,fotos:["fotos/controle-ps4-1.jpg","fotos/controle-ps4-2.jpg"],desc:"Controle sem fio no estilo DualShock 4, compatível com PS4 e PC."},
  {id:11,nome:"Rádio MP3 First Som",cat:"Eletrônicos",preco:100,status:"Disponível",estoque:null,fotos:["fotos/radio-mp3-1.jpg","fotos/radio-mp3-2.jpg","fotos/radio-mp3-3.jpg"],desc:"Rádio MP3 automotivo 1 Din com bluetooth, USB, leitor de cartão SD e rádio FM. Atende chamadas com viva-voz e toca músicas sem fio."},
  {id:12,nome:"Cartão Rastreador UGREEN",cat:"Eletrônicos",preco:70,status:"Oculto",estoque:null,fotos:[],desc:"Cartão rastreador UGREEN."},
  {id:13,nome:"Fone de ouvido para capacete V10",cat:"Acessórios",preco:75,status:"Disponível",estoque:null,fotos:["fotos/fone-capacete-1.jpg","fotos/fone-capacete-2.jpg"],desc:"Fone bluetooth para capacete de moto, com bluetooth 5.3, até 30h de chamadas e alcance de 20m. Compatível com Android e iOS."},
  {id:14,nome:"Relógio com GPS + Strava + Alexa",cat:"Acessórios",preco:260,status:"Oculto",estoque:null,fotos:[],desc:"Relógio com GPS, integração com Strava e Alexa."},
  {id:15,nome:"Relógio Masculino",cat:"Acessórios",preco:140,status:"Disponível",estoque:null,fotos:["fotos/relogio-1.jpg","fotos/relogio-2.jpg"],desc:"Relógio masculino elegante, à prova d'água (30m) e com calendário. Estilo executivo para ocasiões sociais e reuniões."},
  {id:16,nome:"Chaleira Inox",cat:"Utilidades",preco:70,status:"Disponível",estoque:null,fotos:["fotos/chaleira-1.jpg","fotos/chaleira-2.jpg"],desc:"Chaleira elétrica em inox de 1,8 litro, com desligamento automático de segurança e indicador luminoso."},
  {id:17,nome:"Torneira de Parede",cat:"Utilidades",preco:40,status:"Disponível",estoque:null,fotos:["fotos/torneira-1.jpg","fotos/torneira-2.jpg"],desc:"Torneira de parede flexível com duplo jato (concentrado e chuveirinho). Alcança cantos difíceis da cuba e ajuda a economizar água."}
];
const CATS = ["Todos","Ferramentas","Acessórios","Eletrônicos","Utilidades"];
const GARANTIA = "Garantia de 7 dias. Se tiver qualquer problema, fale com a gente pelo WhatsApp.";
// ======================================================================

const visiveis = () => PRODUTOS.filter(p => p.status !== "Oculto");
const money = v => "R$ " + Number(v).toFixed(2).replace(".", ",");
const pct = p => (p.antigo && p.antigo > p.preco) ? Math.round((p.antigo - p.preco) / p.antigo * 100) : 0;
const waLink = txt => "https://wa.me/" + WA + "?text=" + encodeURIComponent(txt);
const compra = p => `Oi! Vi o *${p.nome}* por ${money(p.preco)} no site da Multifix e quero comprar. Ainda está disponível?`;
const duvida = p => `Oi! Tenho uma dúvida sobre o *${p.nome}* que vi no site da Multifix.`;
const TOP = "Oi! Vim pelo site da Multifix e quero ver o que está disponível.";

let catAtual = "Todos", busca = "";
let gFotos = [], gIdx = 0, gLeg = [];

// ---------- planilha ----------
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim();

function parsePreco(v){
  if (v == null) return NaN;
  let s = String(v).replace(/R\$|\s/g, "");
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  return parseFloat(s);
}

function parseCSV(text){
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"' && text[i+1] === '"'){ cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ","){ row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r"){
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); rows.push(row); row = []; cur = "";
    } else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows;
}

function linkFoto(f){
  // aceita: nome do arquivo na pasta fotos, link direto, ou link de compartilhamento do Google Drive
  const drive = f.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=view&)?id=)([\w-]+)/);
  if (drive) return "https://drive.google.com/uc?export=view&id=" + drive[1];
  return f.startsWith("http") ? f : "fotos/" + f;
}

async function carregarPlanilha(){
  if (!PLANILHA_CSV) return;
  try{
    const r = await fetch(PLANILHA_CSV, {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const rows = parseCSV(await r.text());
    const head = rows[0].map(norm);
    const lista = rows.slice(1).filter(x => x.some(c => c.trim())).map((x, i) => {
      const o = {}; head.forEach((h, j) => o[h] = (x[j] || "").trim());
      const preco = parsePreco(o["preco"]);
      if (!o["nome"] || isNaN(preco)) return null;
      return {
        id: parseInt(o["id"]) || (i + 1),
        nome: o["nome"],
        cat: o["categoria"] || "Utilidades",
        preco,
        antigo: parsePreco(o["preco antigo"]) || null,
        status: o["status"] || "Disponível",
        estoque: parseInt(o["estoque"]) || null,
        fotos: ["foto 1","foto 2","foto 3"].map(k => o[k]).filter(Boolean).map(linkFoto),
        legendas: ["legenda foto 1","legenda foto 2","legenda foto 3"].map(k => o[k] || ""),
        desc: o["descricao"] || ""
      };
    }).filter(Boolean);
    if (lista.length) PRODUTOS = lista;
  }catch(e){
    console.warn("Planilha não carregada, usando lista interna.", e);
  }
}

// ---------- vitrine ----------
function setWa(){
  document.getElementById("wa-top").href = waLink(TOP);
  document.getElementById("wa-float").href = waLink(TOP);
}

function precoHTML(p, grande){
  const d = pct(p);
  const linha = `<div class="preco-linha">${d ? `<span class="old">${money(p.antigo)}</span><span class="pct">-${d}%</span>` : ""}</div>`;
  return linha + `<div class="${grande ? "det-price" : "price"}">${money(p.preco)}</div>`;
}

function cardHTML(p){
  const ok = p.status === "Disponível";
  const img = p.fotos.length
    ? `<img src="${p.fotos[0]}" alt="${p.nome}">`
    : `<div class="ph">Foto em breve</div>`;
  return `
  <div class="card">
    <div class="img" onclick="ir(${p.id})">${img}</div>
    <div class="info">
      <span class="tag ${ok ? "ok" : "no"}">${ok ? "Pronta entrega" : "Esgotado"}</span>
      <div class="name" onclick="ir(${p.id})">${p.nome}</div>
      ${precoHTML(p, false)}
      ${ok
        ? `<a class="btn" href="${waLink(compra(p))}" target="_blank" rel="noopener" onclick="registrarClique(${p.id})">Comprar agora</a>`
        : `<span class="btn off">Esgotado</span>`}
    </div>
  </div>`;
}

// ----- ordem da vitrine: muda a cada visita, mas quem navega por um assunto vê mais dele -----
// Cada produto aberto ou comprado soma 3 pontos; cada categoria aberta soma 1 ponto.
// Na hora de montar a vitrine entra um sorteio, então a ordem nunca fica igual de uma visita para outra.
let ordemVisita = null;

function lerContagem(chave){
  try { return JSON.parse(localStorage.getItem(chave) || "{}"); } catch(e){ return {}; }
}
function registrarClique(id){
  try {
    const p = PRODUTOS.find(x => x.id === id);
    const prods = lerContagem("mf_cliques"), cats = lerContagem("mf_cats");
    prods[id] = (prods[id] || 0) + 1;
    if (p) cats[p.cat] = (cats[p.cat] || 0) + 1;
    localStorage.setItem("mf_cliques", JSON.stringify(prods));
    localStorage.setItem("mf_cats", JSON.stringify(cats));
  } catch(e){}
  ordemVisita = null; // a próxima vitrine já considera este clique
}
function ordenar(lista){
  if (!ordemVisita){
    const prods = lerContagem("mf_cliques"), cats = lerContagem("mf_cats");
    ordemVisita = {};
    PRODUTOS.forEach(p => {
      ordemVisita[p.id] = (prods[p.id] || 0) * 3 + (cats[p.cat] || 0) + Math.random() * 2;
    });
  }
  return lista.slice().sort((a, b) => (ordemVisita[b.id] || 0) - (ordemVisita[a.id] || 0));
}

function vitrine(){
  const lista = ordenar(visiveis().filter(p =>
    (catAtual === "Todos" || p.cat === catAtual) &&
    p.nome.toLowerCase().includes(busca.toLowerCase())
  ));
  const chips = CATS.map(c =>
    `<button class="chip ${c === catAtual ? "on" : ""}" onclick="filtrar('${c}')">${c}</button>`).join("");
  document.getElementById("app").innerHTML = `
    <input class="search" placeholder="Buscar produto..." value="${busca}" oninput="busca=this.value;vitrine()">
    <div class="filters">${chips}</div>
    <div class="grid">${lista.length ? lista.map(cardHTML).join("") : '<div class="empty">Nenhum produto encontrado.</div>'}</div>`;
  const inp = document.querySelector(".search");
  if (busca){ inp.focus(); inp.setSelectionRange(busca.length, busca.length); }
}

function filtrar(c){ catAtual = c; vitrine(); }

// ---------- produto ----------
function relacionados(p){
  const base = ordenar(visiveis().filter(x => x.id !== p.id));
  return [...base.filter(x => x.cat === p.cat), ...base.filter(x => x.cat !== p.cat)].slice(0, 3);
}

function mostrarFoto(i){
  if (!gFotos.length) return;
  gIdx = (i + gFotos.length) % gFotos.length;
  const m = document.getElementById("main");
  if (m) m.src = gFotos[gIdx];
  document.querySelectorAll(".thumbs img").forEach((t, k) => t.classList.toggle("on", k === gIdx));
}

function detalhe(id){
  const p = PRODUTOS.find(x => x.id === id);
  if (!p || p.status === "Oculto") return vitrine();
  const ok = p.status === "Disponível";
  registrarClique(id);
  gFotos = p.fotos.slice(); gIdx = 0; gLeg = (p.legendas || []).slice();

  const galeria = gFotos.length
    ? `<div class="main-wrap">
         <img class="main" id="main" src="${gFotos[0]}" alt="${p.nome}" onclick="abrirFoto()">
         ${gFotos.length > 1 ? `
           <button class="gnav prev" aria-label="Foto anterior" onclick="event.stopPropagation();mostrarFoto(gIdx-1)">‹</button>
           <button class="gnav next" aria-label="Próxima foto" onclick="event.stopPropagation();mostrarFoto(gIdx+1)">›</button>` : ""}
       </div>
       ${gFotos.length > 1 ? `<div class="thumbs">${gFotos.map((f, i) =>
         `<img src="${f}" class="${i === 0 ? "on" : ""}" alt="" onclick="mostrarFoto(${i})">`).join("")}</div>` : ""}`
    : `<div class="ph" style="aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:var(--panel2);border-radius:10px">Foto em breve</div>`;

  const rel = relacionados(p);
  document.getElementById("app").innerHTML = `
    <span class="back" onclick="ir('')">← Voltar</span>
    <div class="detail">
      <div class="gal">${galeria}</div>
      <div>
        <span class="tag ${ok ? "ok" : "no"}">${ok ? "Pronta entrega" : "Esgotado"}</span>
        <h1>${p.nome}</h1>
        ${precoHTML(p, true)}
        <p class="desc">${p.desc}</p>
        <div class="guar">${GARANTIA}</div>
        <div class="acts">
          ${ok ? `<a class="btn" href="${waLink(compra(p))}" target="_blank" rel="noopener">Comprar agora no WhatsApp</a>`
               : `<span class="btn off">Esgotado</span>`}
          <a class="btn ghost" href="${waLink(duvida(p))}" target="_blank" rel="noopener">Tirar dúvida</a>
        </div>
      </div>
    </div>
    ${rel.length ? `<h2 class="rel">Você também pode gostar</h2><div class="grid">${rel.map(cardHTML).join("")}</div>` : ""}`;

  const m = document.getElementById("main");
  if (m && gFotos.length > 1) swipe(m, dir => mostrarFoto(gIdx + dir));
  window.scrollTo(0, 0);
}

// deslizar o dedo para o lado (celular)
function swipe(el, onSwipe){
  let x0 = null;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
  el.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40){ onSwipe(dx < 0 ? 1 : -1); el.dataset.swiped = "1"; setTimeout(() => delete el.dataset.swiped, 300); }
  }, {passive:true});
}

// ---------- visualizador de fotos ----------
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lb-img");
let lbOn = false, lbSwiped = false;

function lbDraw(){
  lbImg.src = gFotos[gIdx];
  const leg = document.getElementById("lb-leg");
  if (leg) leg.textContent = gLeg[gIdx] || "";
  lb.querySelectorAll(".lb-nav").forEach(b => b.style.display = gFotos.length > 1 ? "" : "none");
}
function abrirFoto(){
  if (!gFotos.length) return;
  lbOn = true; lb.classList.add("open"); lbDraw();
  document.body.style.overflow = "hidden";
}
function fecharFoto(){
  lbOn = false; lb.classList.remove("open");
  document.body.style.overflow = "";
}
function navFoto(d){ mostrarFoto(gIdx + d); lbDraw(); }

lb.addEventListener("click", () => { if (lbSwiped) return; fecharFoto(); });
lb.querySelector(".lb-x").addEventListener("click", e => { e.stopPropagation(); fecharFoto(); });
lb.querySelector(".lb-prev").addEventListener("click", e => { e.stopPropagation(); navFoto(-1); });
lb.querySelector(".lb-next").addEventListener("click", e => { e.stopPropagation(); navFoto(1); });

let lbX0 = null;
lb.addEventListener("touchstart", e => { lbX0 = e.touches[0].clientX; }, {passive:true});
lb.addEventListener("touchend", e => {
  if (lbX0 === null) return;
  const dx = e.changedTouches[0].clientX - lbX0; lbX0 = null;
  if (Math.abs(dx) > 40){
    lbSwiped = true; setTimeout(() => lbSwiped = false, 300);
    navFoto(dx < 0 ? 1 : -1);
  }
}, {passive:true});

document.addEventListener("keydown", e => {
  if (!lbOn) return;
  if (e.key === "Escape") fecharFoto();
  if (e.key === "ArrowLeft") navFoto(-1);
  if (e.key === "ArrowRight") navFoto(1);
});

// ---------- rotas ----------
function ir(id){
  location.hash = id ? "produto=" + id : "";
}
function rota(){
  ordemVisita = null;
  const h = location.hash.replace("#", "");
  if (h.startsWith("produto=")) detalhe(parseInt(h.split("=")[1]));
  else vitrine();
}
window.addEventListener("hashchange", rota);

async function iniciar(){
  document.getElementById("app").innerHTML = '<div class="empty">Carregando produtos...</div>';
  await carregarPlanilha();
  setWa();
  rota();
}
iniciar();
</script>
